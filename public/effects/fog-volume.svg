<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <filter id="smoke" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".012 .022" numOctaves="4" seed="23" result="cloud"/>
      <feColorMatrix in="cloud" type="matrix" values="0 0 0 0 .77  0 0 0 0 .85  0 0 0 0 .92  1.5 1.5 1.5 0 -1.5"/>
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
    <radialGradient id="edge"><stop offset=".1" stop-color="white"/><stop offset="1" stop-color="black"/></radialGradient>
    <mask id="billow"><ellipse cx="256" cy="265" rx="355" ry="260" fill="url(#edge)"/></mask>
  </defs>
  <rect width="512" height="512" filter="url(#smoke)" mask="url(#billow)"/>
</svg>
